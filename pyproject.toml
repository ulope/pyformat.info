[project]
name = "pyformat-site"
version = "0.0.0"
description = "Generator for pyformat.info, a cheat sheet about Python string formatting"
readme = "README.md"
license = "MIT"
# The examples are tested on every supported Python version. Generating the
# site needs the newest version used by tests/test_content_py3NN.py (see
# `pyformat generate --help`).
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "libsass>=0.23",
    "markdown>=3.5",
    "markupsafe>=2.1",
    "pygments>=2.19",
]

[project.scripts]
pyformat = "main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "wrapt>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
